# TicketIA — entorno completo con Docker
#
#   docker compose up -d
#   docker compose exec php php bin/instalar.php --con-demo
#   abrir http://localhost:8080
#
# Nota: para usar IA local (LM Studio/Ollama) ejecutandose en tu maquina,
# usa host.docker.internal en LLM_LOCAL_ENDPOINT dentro de .env.

services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/ticketia
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ticketia
      DB_USER: ticketia
      DB_PASS: ticketia
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/ticketia:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ticketia
      MARIADB_USER: ticketia
      MARIADB_PASSWORD: ticketia
      MARIADB_ROOT_PASSWORD: ticketia-root
    volumes:
      - datos_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Servidor SMTP de pruebas: captura los correos en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  datos_db:
