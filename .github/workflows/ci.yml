name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Lint y tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl, mbstring, fileinfo, openssl
          coverage: none

      - name: Lint de sintaxis
        run: |
          fallos=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || fallos=1
          done < <(find public src bin db tests -name '*.php')
          exit $fallos

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Tests unitarios
        run: vendor/bin/phpunit

  experiencia:
    name: Flujos HTTP y aislamiento de clientes
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ticketia_pruebas_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, mbstring, fileinfo, openssl
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - name: Verificar flujos con IA simulada y base desechable
        run: php tests/integration/experiencia.php
        env:
          TEST_DB_USER: root
          TEST_DB_PASS: ticketia_pruebas_ci

  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Smoke test Docker
    runs-on: ubuntu-latest
    env:
      APP_PORT: "8080"
      DB_PASS: ticketia_ci_2026
      DB_ROOT_PASS: ticketia_root_ci_2026
    steps:
      - uses: actions/checkout@v4

      - name: Preparar configuracion desechable
        run: cp .env.example .env

      - name: Construir imagenes
        run: docker compose build

      - name: Arrancar aplicacion
        run: docker compose up -d --wait db php nginx

      - name: Comprobar extensiones PHP
        run: |
          docker compose exec -T php php -r '
            $requeridas = ["pdo_mysql", "curl", "mbstring", "fileinfo"];
            $faltan = array_values(array_filter($requeridas, fn($ext) => !extension_loaded($ext)));
            if ($faltan) { fwrite(STDERR, "Faltan: " . implode(", ", $faltan) . "\n"); exit(1); }
          '

      - name: Instalar esquema sin datos de demo
        run: docker compose exec -T php php bin/instalar.php --admin-email=ci@ticketia.test --admin-pass=TicketIA-ci-2026

      - name: Arrancar worker
        run: docker compose up -d --wait worker

      - name: Probar login por HTTP
        run: |
          jar="$(mktemp)"
          html="$(curl --fail --retry 10 --retry-all-errors -sS -c "$jar" http://127.0.0.1:8080/login.php)"
          csrf="$(printf '%s' "$html" | sed -n 's/.*name="csrf" value="\([^"]*\)".*/\1/p' | head -1)"
          test -n "$csrf"
          codigo="$(curl -sS -o /dev/null -w '%{http_code}' -b "$jar" -c "$jar" \
            --data-urlencode 'email=ci@ticketia.test' \
            --data-urlencode 'password=TicketIA-ci-2026' \
            --data-urlencode "csrf=$csrf" \
            http://127.0.0.1:8080/login.php)"
          test "$codigo" = "302"

      - name: Diagnostico de contenedores
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Limpiar stack
        if: always()
        run: docker compose down -v --remove-orphans
