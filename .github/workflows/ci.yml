name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Lint y tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl, mbstring, fileinfo, openssl
          coverage: none

      - name: Lint de sintaxis
        run: |
          fallos=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || fallos=1
          done < <(find public src bin db tests -name '*.php')
          exit $fallos

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Tests unitarios
        run: vendor/bin/phpunit

  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -f docker/Dockerfile -t ticketia:ci .
