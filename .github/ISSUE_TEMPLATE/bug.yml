name: Informe de bug
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué ocurre?
      description: Describe el problema y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Entrar como operador
        2. Abrir el ticket ...
        3. Pulsar ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit de TicketIA
      placeholder: v1.0.0 / abc1234
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "PHP 8.2, MariaDB 10.6, Docker / XAMPP, navegador..."
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Errores del log de PHP, de la consola del navegador o capturas de pantalla.
